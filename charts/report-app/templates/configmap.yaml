apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "report-app.fullname" . }}-config
  labels:
    {{- include "report-app.labels" . | nindent 4 }}
data:
  APP_NAME: {{ .Values.config.appName | quote }}
  APP_ENV: {{ .Values.config.appEnv | quote }}
  APP_DEBUG: {{ .Values.config.appDebug | quote }}
  APP_URL: {{ .Values.config.appUrl | quote }}
  APP_LOCALE: {{ .Values.config.appLocale | quote }}

  LOG_CHANNEL: {{ .Values.config.logChannel | quote }}
  LOG_STACK: "single"
  LOG_DEPRECATIONS_CHANNEL: "null"
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}

  DB_CONNECTION: "pgsql"
  DB_HOST: {{ include "report-app.dbHost" . | quote }}
  DB_PORT: {{ .Values.postgres.service.port | quote }}
  DB_DATABASE: {{ .Values.postgres.database | quote }}
  DB_USERNAME: {{ .Values.postgres.username | quote }}

  SESSION_DRIVER: "file"
  SESSION_LIFETIME: "120"

  FILESYSTEM_DISK: "local"
  CACHE_STORE: "file"

  REDIS_CLIENT: "predis"
  REDIS_HOST: {{ include "report-app.redisHost" . | quote }}
  REDIS_PORT: {{ .Values.redis.service.port | quote }}
  REDIS_DB: "0"

  QUEUE_CONNECTION: "redis"
  REDIS_QUEUE: "reports"
  REDIS_QUEUE_RETRY_AFTER: "900"

  REPORT_SUBDIR: {{ .Values.config.reportsSubdir | quote }}
  REPORT_CHUNK_SIZE: {{ .Values.config.chunkSize | quote }}
