apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "report-app.fullname" . }}-app
  labels:
    {{- include "report-app.componentLabels" (dict "root" . "component" "app") | nindent 4 }}
spec:
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels:
      {{- include "report-app.componentSelectorLabels" (dict "root" . "component" "app") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "report-app.componentSelectorLabels" (dict "root" . "component" "app") | nindent 8 }}
    spec:
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            {{- include "report-app.envFrom" . | nindent 12 }}
          livenessProbe:
            exec:
              command: ["php", "artisan", "health:check"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          {{- if .Values.reportsVolume.enabled }}
          volumeMounts:
            - name: reports
              mountPath: /app/storage/app/{{ .Values.config.reportsSubdir }}
          {{- end }}
      {{- if .Values.reportsVolume.enabled }}
      volumes:
        - name: reports
          persistentVolumeClaim:
            claimName: {{ include "report-app.fullname" . }}-reports
      {{- end }}
