apiVersion: v1
kind: Service
metadata:
  name: {{ include "report-app.fullname" . }}-app
  labels:
    {{- include "report-app.componentLabels" (dict "root" . "component" "app") | nindent 4 }}
spec:
  type: {{ .Values.app.service.type }}
  ports:
    - port: {{ .Values.app.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "report-app.componentSelectorLabels" (dict "root" . "component" "app") | nindent 4 }}
