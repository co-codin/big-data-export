{{- if .Values.redis.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "report-app.fullname" . }}-redis
  labels:
    {{- include "report-app.componentLabels" (dict "root" . "component" "redis") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.redis.service.port }}
      targetPort: redis
      protocol: TCP
      name: redis
  selector:
    {{- include "report-app.componentSelectorLabels" (dict "root" . "component" "redis") | nindent 4 }}
{{- end -}}
