name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Pint + PHPUnit
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo, pdo_pgsql, pgsql, mbstring, zip, intl
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php8.2-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php8.2-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare .env
        run: |
          cp .env.example .env
          # CI talks to localhost-mapped service containers, not docker-compose names
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^REDIS_HOST=.*/REDIS_HOST=127.0.0.1/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=app_test/' .env

      - name: Pint (lint check)
        run: vendor/bin/pint --test

      - name: Run migrations on app_test
        run: php artisan migrate --force --env=testing
        env:
          APP_ENV: testing
          DB_HOST: 127.0.0.1
          DB_DATABASE: app_test
          DB_USERNAME: app
          DB_PASSWORD: secret
          REDIS_HOST: 127.0.0.1

      - name: PHPUnit
        run: vendor/bin/phpunit --colors=always
        env:
          APP_ENV: testing
          DB_HOST: 127.0.0.1
          DB_DATABASE: app_test
          DB_USERNAME: app
          DB_PASSWORD: secret
          REDIS_HOST: 127.0.0.1
